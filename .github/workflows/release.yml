name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Windows (x86_64)'
        required: true
        default: true
        type: boolean
      linux:
        description: 'Linux (x86_64)'
        required: true
        default: true
        type: boolean
      macos_x64:
        description: 'macOS (x86_64 / Intel)'
        required: true
        default: false
        type: boolean
      macos_arm64:
        description: 'macOS (ARM64 / Apple Silicon)'
        required: true
        default: false
        type: boolean
      android:
        description: 'Android'
        required: true
        default: false
        type: boolean
      iOS:
        description: 'iOS'
        required: true
        default: false
        type: boolean
      tag_name:
        description: 'Release tag name (leave empty to auto-generate from commit hash)'
        required: false
        default: ''
        type: string
      tag_prefix:
        description: 'Auto-generated tag prefix (default: "release-", use "devbuild-" for dev builds)'
        required: false
        default: 'release-'
        type: string
      name_prefix:
        description: 'Auto-generated release name prefix (default: "Release ")'
        required: false
        default: 'Release '
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

env:
  PROJECT_NAME: KathyEngine
  HAXE_VERSION: 4.3.7

jobs:
  commit-info:
    uses: ./.github/workflows/commit-info.yml

  build-windows:
    name: Windows
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.windows }}
    with:
      name: Windows
      os: windows-2022
      setupCommand: .\setup\windows.bat
      buildArgs: "windows -final -D officialBuild"
      artifactName: windowsBuild-x86_64
      artifactPath: export\release\windows\bin\*

  build-linux:
    name: Linux
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.linux }}
    with:
      name: Linux
      os: ubuntu-24.04
      setupCommand: sh ./setup/unix.sh
      buildArgs: "linux -final -D officialBuild"
      artifactName: linuxBuild-x86_64
      artifactPath: export/release/linux/bin/*

  # 注意：`macos-15` 是 arm64 (M1, 3C/7G) runner，不是 Intel。
  # x64 版必须用 `macos-15-intel`，否则既拿不到 x86_64 主机，
  # 又会和 ARM64 / iOS 一起挤本就紧张的 arm64 容量池（曾出现 3 个 job 排队
  # 15 分钟后被平台 cancelled，零 step、零 artifact）。
  build-macos-x64:
    name: macOS x86_64
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.macos_x64 }}
    with:
      name: macOS x86_64
      os: macos-15-intel
      setupCommand: sh ./setup/unix.sh
      buildArgs: "mac -64 -D HXCPP_M64 -final -D officialBuild"
      artifactName: macOSBuild-x86_64
      artifactPath: export/release/macos/bin/*

  # 唯一必须留在 arm64 池里的 job，其余 macOS 工作都挪到 Intel 池。
  build-macos-arm64:
    name: macOS ARM64
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.macos_arm64 }}
    with:
      name: macOS ARM64
      os: macos-15
      setupCommand: sh ./setup/unix.sh
      buildArgs: "mac -arm64 -D HXCPP_ARM64 -final -D officialBuild"
      artifactName: macOSBuild-arm64
      artifactPath: export/release/macos/bin/*

  build-android:
    name: Android
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.android }}
    # Android 完全可以跑在 ubuntu 上，比 macos 便宜 10x
    with:
      name: Android
      os: ubuntu-24.04
      setupCommand: sh ./setup/unix.sh
      buildArgs: "android -final -D officialBuild"
      artifactName: androidBuild
      artifactPath: export/release/android/bin/app/build/outputs/apk/release/*.apk

  # iOS 编译不依赖主机架构，用 Intel runner 同样能产出 arm64 IPA，
  # 还能避开 arm64 容量池，减少和 macOS ARM64 抢 runner。
  build-ios:
    name: iOS
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.iOS }}
    with:
      name: iOS
      os: macos-15-intel
      setupCommand: sh ./setup/unix.sh
      buildArgs: "ios -final -nosign -D officialBuild"
      artifactName: iOSBuild
      artifactPath: export/release/ios/build/Release-iphoneos/*.ipa

  release:
    name: Release
    needs: [commit-info, build-windows, build-linux, build-macos-x64, build-macos-arm64, build-android, build-ios]
    # 至少勾选了一个平台，且至少有一个构建成功才继续
    if: ${{ !cancelled() && (inputs.windows || inputs.linux || inputs.macos_x64 || inputs.macos_arm64 || inputs.android || inputs.iOS) && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos-x64.result == 'success' || needs.build-macos-arm64.result == 'success' || needs.build-android.result == 'success' || needs.build-ios.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # 下载条件同时看「是否勾选」和「该平台构建是否真的成功」：
      # job 被 cancelled / failed 时不去下载不存在的 artifact；
      # continue-on-error 保证单个平台产物缺失不会带崩其余平台的发布。
      - name: Download Windows
        if: ${{ inputs.windows && needs.build-windows.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windowsBuild-x86_64
          path: builds/windows

      - name: Download Linux
        if: ${{ inputs.linux && needs.build-linux.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linuxBuild-x86_64
          path: builds/linux

      - name: Download macOS x64
        if: ${{ inputs.macos_x64 && needs.build-macos-x64.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macOSBuild-x86_64
          path: builds/macos-x64

      - name: Download macOS arm64
        if: ${{ inputs.macos_arm64 && needs.build-macos-arm64.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macOSBuild-arm64
          path: builds/macos-arm64

      - name: Download Android
        if: ${{ inputs.android && needs.build-android.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: androidBuild
          path: builds/android

      - name: Download iOS
        if: ${{ inputs.iOS && needs.build-ios.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: iOSBuild
          path: builds/ios

      - name: Compress & Prepare
        run: |
          # runner 自带 7z，无需 apt install。
          # 只在目录里确实有文件时才打包：download-artifact 失败可能只留下空目录，
          # 旧的 `-d` 判断会对空目录执行 7z ./*，产出空包甚至让步骤失败。
          pack() {
            src="$1"; out="$2"
            if [ -d "$src" ] && [ -n "$(ls -A "$src" 2>/dev/null)" ]; then
              (cd "$src" && 7z a -tzip "../../$out" ./*)
            fi
          }
          pack builds/windows     "${{ env.PROJECT_NAME }}-windows.zip"
          pack builds/linux       "${{ env.PROJECT_NAME }}-linux.zip"
          pack builds/macos-x64   "${{ env.PROJECT_NAME }}-macos-x64.zip"
          pack builds/macos-arm64 "${{ env.PROJECT_NAME }}-macos-arm64.zip"
          if ls builds/android/*.apk >/dev/null 2>&1; then cp builds/android/*.apk "./${{ env.PROJECT_NAME }}-android.apk"; fi
          if ls builds/ios/*.ipa >/dev/null 2>&1; then cp builds/ios/*.ipa "./${{ env.PROJECT_NAME }}-ios.ipa"; fi

      - name: Build file list & Release Info
        id: release_info
        run: |
          # 只收集真实存在的文件；用 if 而非 `[ -f ] && ...`，
          # 避免 bash -e 下最后一条 `&&` 返回 1 时整步误退出。
          files=""
          for f in \
            "${{ env.PROJECT_NAME }}-windows.zip" \
            "${{ env.PROJECT_NAME }}-linux.zip" \
            "${{ env.PROJECT_NAME }}-macos-x64.zip" \
            "${{ env.PROJECT_NAME }}-macos-arm64.zip" \
            "${{ env.PROJECT_NAME }}-android.apk" \
            "${{ env.PROJECT_NAME }}-ios.ipa"; do
            if [ -f "$f" ]; then files+="$f"$'\n'; fi
          done

          # 一个产物都没下到就别创建空 Release（说明所有平台都失败/被取消了）。
          if [ -z "$files" ]; then
            echo "::error::没有下载到任何构建产物，终止发布。"
            exit 1
          fi

          if [ -n "${{ inputs.tag_name }}" ]; then
            tag="${{ inputs.tag_name }}"
            name="${{ inputs.tag_name }}"
          else
            tag="${{ inputs.tag_prefix }}${{ needs.commit-info.outputs.commit_hash }}"
            name="${{ inputs.name_prefix }}${{ needs.commit-info.outputs.commit_hash }}"
          fi

          # 用 heredoc 把多行 files 写进 GITHUB_OUTPUT
          {
            echo "files<<EOF"
            printf '%s' "$files"
            echo "EOF"
            echo "tag=$tag"
            echo "name=$name"
          } >> $GITHUB_OUTPUT

          echo "--- Release Info ---"
          echo "tag: $tag"
          echo "name: $name"
          echo "files:"
          printf '%s' "$files"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_info.outputs.name }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.release_info.outputs.files }}
